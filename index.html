<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX DICE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d14;
            --card-bg: #141724;
            --accent-yellow: #ffcc00;
            --accent-red: #ff3366;
            --accent-green: #00e676;
            --accent-blue: #00b0ff;
            --accent-purple: #9d4edd;
            --text-white: #ffffff;
            --text-dim: #8c9bbf;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Fredoka One', cursive, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
        }

        /* Sidebars for Streamers */
        .streamers-sidebar {
            width: 240px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            border: 2px solid #202538;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: fit-content;
        }

        .sidebar-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: 16px;
            text-align: center;
            color: var(--accent-yellow);
            letter-spacing: 1px;
        }

        .streamer-card {
            background: #0d0f17;
            border: 1px solid #252b3e;
            padding: 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, border-color 0.2s;
        }

        .streamer-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-yellow);
        }

        .streamer-card.live {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #252b3e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }

        .streamer-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .streamer-name {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .streamer-handle {
            font-size: 11px;
            color: var(--text-dim);
        }

        .live-badge {
            background: var(--accent-red);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Center App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: 26px;
            letter-spacing: 1.5px;
            color: var(--text-white);
            text-shadow: 2px 2px 0px #000;
        }

        .btn-owner-panel {
            background: linear-gradient(180deg, #ff3366 0%, #d80032 100%);
            border: 2px solid #ff7597;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #80001d;
        }

        .btn-owner-panel:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #80001d;
        }

        /* Selectors Grid */
        .selectors-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .custom-select {
            background-color: #202538;
            border: 2px solid #323954;
            color: white;
            padding: 10px 8px;
            border-radius: 14px;
            font-size: 14px;
            text-align: center;
            outline: none;
            cursor: pointer;
        }

        /* Dice Area */
        .dice-area {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            min-height: 120px;
            border: 2px solid #202538;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .dice {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
            border: 3px solid rgba(255,255,255,0.2);
            transition: transform 0.15s, background-color 0.2s;
        }

        .dice.rolling {
            animation: rollAnim 0.3s infinite linear;
        }

        @keyframes rollAnim {
            0% { transform: rotate(0deg) scale(0.95); }
            50% { transform: rotate(180deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(0.95); }
        }

        /* Dice Colors */
        .bg-purple { background-color: var(--accent-purple); }
        .bg-yellow { background-color: var(--accent-yellow); color: #000; }
        .bg-red { background-color: var(--accent-red); }
        .bg-blue { background-color: var(--accent-blue); }
        .bg-orange { background-color: #ff9100; }
        .bg-green { background-color: var(--accent-green); color: #000; }

        /* Game ID and Verification */
        .session-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .game-id {
            font-size: 18px;
            letter-spacing: 1px;
        }

        .game-id span {
            color: var(--accent-yellow);
        }

        .btn-verify {
            background-color: #202538;
            border: 2px solid #343d5c;
            color: #4da6ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        /* Roll Button */
        .btn-roll {
            background: linear-gradient(180deg, #ffd000 0%, #ff9100 100%);
            border: none;
            color: #000;
            font-family: 'Luckiest Guy', cursive;
            font-size: 30px;
            padding: 16px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b36b00;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn-roll:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b36b00;
        }

        .btn-roll:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Board Card */
        .board-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            border: 2px solid #202538;
        }

        .score-adjuster {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0d0f17;
            padding: 10px 15px;
            border-radius: 14px;
            margin-bottom: 12px;
        }

        .score-btn {
            background-color: #252b3e;
            border: 1px solid #3a4361;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .score-value {
            font-size: 36px;
            font-weight: bold;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .stat-pill {
            flex: 1;
            background-color: #0d0f17;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
        }

        /* History Card */
        .history-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            border: 2px solid #202538;
        }

        .history-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .rolls-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .roll-item {
            background-color: #0d0f17;
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-red);
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 18px;
            color: var(--accent-red);
        }

        .modal-close {
            cursor: pointer;
            font-size: 20px;
            color: var(--text-dim);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            background: #0d0f17;
            border: 1px solid #323954;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .btn-save {
            width: 100%;
            padding: 10px;
            background: var(--accent-red);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .streamers-sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Left Streamers Sidebar -->
        <div class="streamers-sidebar">
            <div class="sidebar-title">OUR TOP STREAMERS</div>
            <a href="https://tiktok.com" target="_blank" class="streamer-card live">
                <div class="avatar">M</div>
                <div class="streamer-info">
                    <span class="streamer-name">MEDX</span>
                    <span class="streamer-handle">@medxlive</span>
                </div>
                <span class="live-badge">LIVE</span>
            </a>
            <a href="https://tiktok.com" target="_blank" class="streamer-card">
                <div class="avatar">F</div>
                <div class="streamer-info">
                    <span class="streamer-name">FROZY</span>
                    <span class="streamer-handle">@frozy777</span>
                </div>
            </a>
        </div>

        <!-- Center Main Game Box -->
        <div class="app-container">
            <div class="header">
                <button class="btn-owner-panel" onclick="openOwnerPanel()">OWNER PANEL 👑</button>
                <div class="brand-title">APEX DICE</div>
            </div>

            <div class="selectors-grid">
                <select class="custom-select" id="diceCountSelect" onchange="renderDice()">
                    <option value="4">4 DICE</option>
                    <option value="3">3 DICE</option>
                    <option value="2">2 DICE</option>
                    <option value="1">1 DICE</option>
                </select>
                <select class="custom-select"><option>COLOR</option></select>
                <select class="custom-select"><option>SAB-BI</option></select>
            </div>

            <div class="dice-area" id="diceArea"></div>

            <div class="session-info">
                <div class="game-id">ID: <span id="gameIdDisplay">--------</span></div>
                <button class="btn-verify" onclick="openVerifyModal()">⏱️ Verify History</button>
            </div>

            <button class="btn-roll" id="rollBtn" onclick="triggerRoll()">GO AGAIN !</button>

            <div class="board-card">
                <div class="score-adjuster">
                    <div>
                        <button class="score-btn" onclick="updateScore(-1)">-1</button>
                        <button class="score-btn" onclick="updateScore(-10)">-10</button>
                    </div>
                    <div class="score-value" id="scoreDisplay">0</div>
                    <div>
                        <button class="score-btn" onclick="updateScore(1)">+1</button>
                        <button class="score-btn" onclick="updateScore(10)">+10</button>
                    </div>
                </div>

                <div class="stats-bar">
                    <div class="stat-pill">Streak: <span id="streakDisplay">0</span> 🎲</div>
                    <div class="stat-pill">
                        <span class="status-dot"></span>
                        Online: <span id="onlineDisplay">633</span>
                    </div>
                </div>
            </div>

            <div class="history-card">
                <div class="history-title">YOUR LAST 20 ROLLS</div>
                <div class="rolls-list" id="rollsHistory"></div>
            </div>
        </div>

        <!-- Right Streamers Sidebar -->
        <div class="streamers-sidebar">
            <div class="sidebar-title">TOP STREAMERS</div>
            <a href="https://tiktok.com" target="_blank" class="streamer-card">
                <div class="avatar">L</div>
                <div class="streamer-info">
                    <span class="streamer-name">LIAM TRADES</span>
                    <span class="streamer-handle">@liamtrades</span>
                </div>
            </a>
            <a href="https://tiktok.com" target="_blank" class="streamer-card">
                <div class="avatar">D</div>
                <div class="streamer-info">
                    <span class="streamer-name">DRAVENOX</span>
                    <span class="streamer-handle">@dravenox</span>
                </div>
            </a>
        </div>
    </div>

    <!-- Owner Modal -->
    <div class="modal-overlay" id="ownerModal">
        <div class="modal">
            <div class="modal-header">
                <span>OWNER CONTROL 👑</span>
                <span class="modal-close" onclick="closeOwnerPanel()">&times;</span>
            </div>
            <div class="form-group">
                <label>ONLINE USERS COUNTER</label>
                <input type="number" id="ownerOnlineInput" class="form-input" value="633">
            </div>
            <button class="btn-save" onclick="saveOwnerSettings()">SAVE SETTINGS</button>
        </div>
    </div>

    <!-- Verify Modal -->
    <div class="modal-overlay" id="verifyModal">
        <div class="modal" style="border-color: var(--accent-blue);">
            <div class="modal-header" style="color: var(--accent-blue);">
                <span>VERIFY SESSION LOGS</span>
                <span class="modal-close" onclick="closeVerifyModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>CURRENT SESSION ID</label>
                <input type="text" id="verifyIdInput" class="form-input" readonly>
            </div>
            <div class="form-group">
                <label>SEED (VERIFIED)</label>
                <input type="text" class="form-input" readonly value="Apex-SHA256-Validated">
            </div>
        </div>
    </div>

    <script>
        const colorPalette = [
            { name: 'Red', class: 'bg-red' },
            { name: 'Orange', class: 'bg-orange' },
            { name: 'Yellow', class: 'bg-yellow' },
            { name: 'Green', class: 'bg-green' },
            { name: 'Blue', class: 'bg-blue' },
            { name: 'Purple', class: 'bg-purple' }
        ];

        let score = 0;
        let streak = 0;
        let isRolling = false;

        window.onload = function() {
            generateNewGameId();
            renderDice();
        };

        function generateNewGameId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let res = '';
            for (let i = 0; i < 10; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('gameIdDisplay').innerText = res;
            document.getElementById('verifyIdInput').value = res;
        }

        function renderDice() {
            const count = parseInt(document.getElementById('diceCountSelect').value);
            const container = document.getElementById('diceArea');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const dice = document.createElement('div');
                dice.className = 'dice bg-purple';
                dice.innerText = '⚪';
                container.appendChild(dice);
            }
        }

        function triggerRoll() {
            if (isRolling) return;
            isRolling = true;
            const btn = document.getElementById('rollBtn');
            btn.disabled = true;
            btn.innerText = 'ROLLING... 🎲';

            generateNewGameId();
            const diceElements = document.querySelectorAll('.dice');
            diceElements.forEach(d => d.classList.add('rolling'));

            setTimeout(() => {
                let rolledColors = [];
                diceElements.forEach(d => {
                    d.classList.remove('rolling');
                    const rand = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                    d.className = `dice ${rand.class}`;
                    d.innerText = '⚪';
                    rolledColors.push(rand.name);
                });

                streak++;
                document.getElementById('streakDisplay').innerText = streak;
                addHistoryLog(rolledColors);

                btn.disabled = false;
                btn.innerText = 'GO AGAI
