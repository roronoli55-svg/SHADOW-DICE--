<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX DICE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: #161926;
            --accent-yellow: #ffcc00;
            --accent-red: #ff3366;
            --accent-green: #00e676;
            --accent-blue: #00b0ff;
            --accent-purple: #9d4edd;
            --text-white: #ffffff;
            --text-dim: #8c9bbf;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Fredoka One', cursive, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .brand-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: 26px;
            letter-spacing: 1.5px;
            color: var(--text-white);
            text-shadow: 2px 2px 0px #000;
        }

        .btn-owner-panel {
            background: linear-gradient(180deg, #ff3366 0%, #d80032 100%);
            border: 2px solid #ff7597;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #80001d;
            transition: transform 0.1s;
        }

        .btn-owner-panel:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #80001d;
        }

        /* Controls Section */
        .selectors-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .custom-select {
            background-color: #202538;
            border: 2px solid #323954;
            color: white;
            padding: 10px 8px;
            border-radius: 14px;
            font-size: 14px;
            text-align: center;
            outline: none;
            cursor: pointer;
        }

        /* Dice Display Grid */
        .dice-area {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            min-height: 120px;
            border: 2px solid #202538;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .dice {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
            border: 3px solid rgba(255,255,255,0.2);
            transition: transform 0.15s, background-color 0.2s;
        }

        .dice.rolling {
            animation: rollAnim 0.3s infinite linear;
        }

        @keyframes rollAnim {
            0% { transform: rotate(0deg) scale(0.95); }
            50% { transform: rotate(180deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(0.95); }
        }

        /* Dice Colors */
        .bg-purple { background-color: var(--accent-purple); }
        .bg-yellow { background-color: var(--accent-yellow); color: #000; }
        .bg-red { background-color: var(--accent-red); }
        .bg-blue { background-color: var(--accent-blue); }
        .bg-orange { background-color: #ff9100; }
        .bg-green { background-color: var(--accent-green); color: #000; }

        /* Game ID and Verification */
        .session-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .game-id {
            font-size: 18px;
            letter-spacing: 1px;
            color: #fff;
        }

        .game-id span {
            color: var(--accent-yellow);
        }

        .btn-verify {
            background-color: #202538;
            border: 2px solid #343d5c;
            color: #4da6ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        /* Action Button */
        .btn-roll {
            background: linear-gradient(180deg, #ffd000 0%, #ff9100 100%);
            border: none;
            color: #000;
            font-family: 'Luckiest Guy', cursive;
            font-size: 30px;
            padding: 16px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b36b00;
            letter-spacing: 1px;
            transition: transform 0.05s, box-shadow 0.05s;
            width: 100%;
        }

        .btn-roll:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b36b00;
        }

        .btn-roll:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Score & Stats Board */
        .board-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            border: 2px solid #202538;
        }

        .score-adjuster {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #10121a;
            padding: 10px 15px;
            border-radius: 14px;
            margin-bottom: 12px;
        }

        .score-btn {
            background-color: #252b3e;
            border: 1px solid #3a4361;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .score-value {
            font-size: 36px;
            font-weight: bold;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .stat-pill {
            flex: 1;
            background-color: #10121a;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
        }

        /* Settings Card */
        .settings-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            border: 2px solid #202538;
            font-size: 13px;
            text-align: center;
        }

        .colors-hint {
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        /* Switch UI */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #343d5c;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* History Logs */
        .history-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            border: 2px solid #202538;
        }

        .history-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .rolls-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .roll-item {
            background-color: #10121a;
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-red);
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255,51,102,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 18px;
            color: var(--accent-red);
        }

        .modal-close {
            cursor: pointer;
            font-size: 20px;
            color: var(--text-dim);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            background: #10121a;
            border: 1px solid #323954;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .btn-save {
            width: 100%;
            padding: 10px;
            background: var(--accent-red);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <button class="btn-owner-panel" onclick="openOwnerPanel()">OWNER PANEL 👑</button>
            <div class="brand-title">APEX DICE</div>
        </div>

        <!-- Mode Selectors -->
        <div class="selectors-grid">
            <select class="custom-select" id="diceCountSelect" onchange="renderDice()">
                <option value="4">4 DICE</option>
                <option value="3">3 DICE</option>
                <option value="2">2 DICE</option>
                <option value="1">1 DICE</option>
            </select>
            <select class="custom-select">
                <option>COLOR</option>
            </select>
            <select class="custom-select">
                <option>SAB-BI</option>
            </select>
        </div>

        <!-- Dice Box -->
        <div class="dice-area" id="diceArea">
            <!-- Dynamic Dice Elements Rendered Here -->
        </div>

        <!-- Session ID & Verifier -->
        <div class="session-info">
            <div class="game-id">ID: <span id="gameIdDisplay">--------</span></div>
            <button class="btn-verify" onclick="openVerifyModal()">⏱️ Verify History</button>
        </div>

        <!-- Roll Action Button -->
        <button class="btn-roll" id="rollBtn" onclick="triggerRoll()">GO AGAIN !</button>

        <!-- Score Board -->
        <div class="board-card">
            <div class="score-adjuster">
                <div>
                    <button class="score-btn" onclick="updateScore(-1)">-1</button>
                    <button class="score-btn" onclick="updateScore(-10)" style="margin-left: 4px;">-10</button>
                </div>
                <div class="score-value" id="scoreDisplay">0</div>
                <div>
                    <button class="score-btn" onclick="updateScore(1)">+1</button>
                    <button class="score-btn" onclick="updateScore(10)" style="margin-left: 4px;">+10</button>
                </div>
            </div>

            <div class="stats-bar">
                <div class="stat-pill">Roll Streak: <span id="streakDisplay">0</span> 🎲</div>
                <div class="stat-pill">
                    <span class="status-dot"></span>
                    Users online: <span id="onlineDisplay">633</span>
                </div>
            </div>
        </div>

        <!-- Color Info & Anti-Ban -->
        <div class="settings-card">
            <div class="colors-hint">
                Possible colors are: <span style="color:#ff3366">Red</span>, <span style="color:#ff9100">Orange</span>, <span style="color:#ffcc00">Yellow</span>, <span style="color:#00e676">Green</span>, <span style="color:#00b0ff">Blue</span> and <span style="color:#9d4edd">Purple</span>.
            </div>
            <div class="toggle-row">
                <span>Anti-Ban Mode</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Last Rolls -->
        <div class="history-card">
            <div class="history-title">YOUR LAST 20 ROLLS</div>
            <div class="rolls-list" id="rollsHistory">
                <!-- Log entries added dynamically -->
            </div>
        </div>
    </div>

    <!-- Owner Modal -->
    <div class="modal-overlay" id="ownerModal">
        <div class="modal">
            <div class="modal-header">
                <span>OWNER CONTROL 👑</span>
                <span class="modal-close" onclick="closeOwnerPanel()">&times;</span>
            </div>
            <div class="form-group">
                <label>ONLINE USERS COUNTER</label>
                <input type="number" id="ownerOnlineInput" class="form-input" value="633">
            </div>
            <button class="btn-save" onclick="saveOwnerSettings()">SAVE SETTINGS</button>
        </div>
    </div>

    <!-- Verify Modal -->
    <div class="modal-overlay" id="verifyModal">
        <div class="modal" style="border-color: var(--accent-blue);">
            <div class="modal-header" style="color: var(--accent-blue);">
                <span>VERIFY SESSION LOGS</span>
                <span class="modal-close" onclick="closeVerifyModal()">&times;</span>
            </div>
            <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 12px;">
                All rolls are cryptographic and verified on system creation.
            </div>
            <div class="form-group">
                <label>CURRENT SESSION ID</label>
                <input type="text" id="verifyIdInput" class="form-input" readonly>
            </div>
            <div class="form-group">
                <label>SESSION SEED (VERIFIED)</label>
                <input type="text" id="verifySeedInput" class="form-input" readonly value="Apex-SHA256-Validated">
            </div>
        </div>
    </div>

    <script>
        const colorPalette = [
            { name: 'Red', class: 'bg-red', icon: '🔴' },
            { name: 'Orange', class: 'bg-orange', icon: '🟠' },
            { name: 'Yellow', class: 'bg-yellow', icon: '🟡' },
            { name: 'Green', class: 'bg-green', icon: '🟢' },
            { name: 'Blue', class: 'bg-blue', icon: '🔵' },
            { name: 'Purple', class: 'bg-purple', icon: '🟣' }
        ];

        let score = 0;
        let streak = 0;
        let isRolling = false;
        let rollLogs = [];

        // App Initialization
        window.onload = function() {
            generateNewGameId();
            loadOwnerSettings();
            renderDice();
        };

        function generateGameID() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 10; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generateNewGameId() {
            const newId = generateGameID();
            document.getElementById('gameIdDisplay').innerText = newId;
            document.getElementById('verifyIdInput').value = newId;
        }

        function renderDice() {
            const count = parseInt(document.getElementById('diceCountSelect').value);
            const container = document.getElementById('diceArea');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const dice = document.createElement('div');
                dice.className = 'dice bg-purple';
                dice.innerText = '⚪';
                container.appendChild(dice);
            }
        }

        function triggerRoll() {
            if (isRolling) return;
            isRolling = true;

            const btn = document.getElementById('rollBtn');
            btn.disabled = true;
            btn.innerText = 'ROLLING... 🎲';

            generateNewGameId();

            const diceElements = document.querySelectorAll('.dice');
            diceElements.forEach(d => d.classList.add('rolling'));

            // Simulated Delay (1.2 Seconds)
            setTimeout(() => {
                let rolledColors = [];

                diceElements.forEach(d => {
                    d.classList.remove('rolling');
                    const randomColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                    d.className = `dice ${randomColor.class}`;
                    d.innerText = '⚪';
                    rolledColors.push(randomColor.name);
                });

                streak++;
                document.getElementById('streakDisplay').innerText = streak;

                // Log Result
                addHistoryLog(rolledColors);

                btn.disabled = false;
                btn.innerText = 'GO AGAIN !';
                isRolling = false;
            }, 1200);
        }

        function updateScore(delta) {
            score += delta;
            document.getElementById('scoreDisplay').innerText = score;
        }

        function addHistoryLog(colors) {
            const container = document.getElementById('rollsHistory');
            const logItem = document.createElement('div');
            logItem.className = 'roll-item';
            
            const time = new Date().toLocaleTimeString().split(' ')[0];
            logItem.innerHTML = `<span>#${rollLogs.length + 1} - ${colors.join(', ')}</span><span style="color:var(--text-dim);">${time}</span>`;

            rollLogs.unshift(logItem);
            container.prepend(logItem);

            if (container.children.length > 20) {
                container.removeChild(container.lastChild);
            }
        }

        /* Owner Modal Controls */
        function openOwnerPanel() {
            document.getElementById('ownerModal').style.display = 'flex';
        }
